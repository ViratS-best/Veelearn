<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Veelearn Simulator Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#f1f5f9;overflow:hidden;display:flex;flex-direction:column;height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#1e293b}::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}
/* TOOLBAR */
.studio-toolbar{background:#1e293b;border-bottom:2px solid #334155;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:100}
.studio-toolbar .brand{color:#3b82f6;font-weight:700;font-size:1.1em;margin-right:12px}
.studio-toolbar button{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-size:.85em;transition:all .2s}
.tb-primary{background:#3b82f6;color:#fff}.tb-primary:hover{background:#2563eb}
.tb-success{background:#10b981;color:#fff}.tb-success:hover{background:#059669}
.tb-danger{background:#ef4444;color:#fff}.tb-danger:hover{background:#dc2626}
.tb-secondary{background:#334155;color:#cbd5e1}.tb-secondary:hover{background:#475569}
.tb-warning{background:#f59e0b;color:#000}.tb-warning:hover{background:#d97706}
.tb-spacer{flex:1}
/* MAIN LAYOUT */
.studio-main{display:flex;flex:1;overflow:hidden}
/* SIDEBAR */
.studio-sidebar{width:260px;background:#1e293b;border-right:2px solid #334155;display:flex;flex-direction:column;overflow:hidden}
.sidebar-search{padding:8px;border-bottom:1px solid #334155}
.sidebar-search input{width:100%;padding:8px 10px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#f1f5f9;font-size:.85em}
.sidebar-search input::placeholder{color:#64748b}
.block-palette{flex:1;overflow-y:auto;padding:8px}
.palette-category{margin-bottom:4px}
.palette-category-header{color:#94a3b8;font-size:.75em;font-weight:700;text-transform:uppercase;padding:6px 8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-radius:4px}
.palette-category-header:hover{background:#334155}
.palette-category-items{display:none;padding:2px 0}
.palette-category.open .palette-category-items{display:block}
.palette-block{padding:7px 10px;margin:2px 4px;border-radius:6px;cursor:grab;font-size:.82em;transition:transform .15s,box-shadow .15s;user-select:none;color:#fff;display:flex;align-items:center;gap:6px}
.palette-block:hover{transform:translateX(4px);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.palette-block:active{cursor:grabbing}
/* Category colors */
.cat-motion{background:linear-gradient(135deg,#3b82f6,#6366f1)}.cat-drawing{background:linear-gradient(135deg,#8b5cf6,#a855f7)}
.cat-3d{background:linear-gradient(135deg,#06b6d4,#0ea5e9)}.cat-physics{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.cat-math{background:linear-gradient(135deg,#10b981,#14b8a6)}.cat-input{background:linear-gradient(135deg,#ec4899,#f43f5e)}
.cat-animation{background:linear-gradient(135deg,#f97316,#fb923c)}.cat-data{background:linear-gradient(135deg,#6366f1,#818cf8)}
.cat-sound{background:linear-gradient(135deg,#d946ef,#c026d3)}.cat-events{background:linear-gradient(135deg,#eab308,#facc15)}
.cat-sensors{background:linear-gradient(135deg,#22d3ee,#67e8f9)}.cat-science{background:linear-gradient(135deg,#4ade80,#22c55e)}
.cat-logic{background:linear-gradient(135deg,#10b981,#34d399)}
/* WORKSPACE */
.workspace-container{flex:1;position:relative;overflow:hidden;background:#0f172a}
.workspace{position:absolute;top:0;left:0;width:6000px;height:6000px;background-image:radial-gradient(circle,#1e293b 1px,transparent 1px);background-size:20px 20px}
.workspace svg.connections{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
/* PLACED BLOCKS */
.placed-block{position:absolute;min-width:180px;background:#1e293b;border:2px solid #334155;border-radius:8px;cursor:move;z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.3);font-size:.82em}
.placed-block.selected{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.4)}
.placed-block.dragging{opacity:.8;z-index:50}
.pb-header{padding:6px 10px;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:center;cursor:move}
.pb-title{font-weight:600;font-size:.9em;color:#fff}
.pb-delete{background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:1em;padding:2px 4px;border-radius:3px}
.pb-delete:hover{color:#ef4444;background:rgba(239,68,68,.15)}
.pb-body{padding:6px 10px 8px}
.pb-input-row{display:flex;align-items:center;margin:3px 0;gap:4px;position:relative}
.pb-input-label{color:#94a3b8;font-size:.78em;min-width:55px}
.pb-input{flex:1;padding:3px 6px;background:#0f172a;border:1px solid #334155;border-radius:4px;color:#f1f5f9;font-size:.8em;min-width:60px}
.pb-input:focus{border-color:#3b82f6;outline:none}
/* Connection points */
.conn-point{width:10px;height:10px;border-radius:50%;border:2px solid #fff;position:absolute;cursor:crosshair;z-index:20;transition:transform .15s}
.conn-point:hover{transform:scale(1.4)}
.conn-point.output{right:-7px;background:#10b981}
.conn-point.input{left:-7px;background:#3b82f6}
/* RIGHT PANEL */
.right-panel{width:380px;background:#1e293b;border-left:2px solid #334155;display:flex;flex-direction:column;overflow:hidden}
.preview-section{flex:1;display:flex;flex-direction:column;min-height:0}
.preview-header{padding:8px 12px;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center}
.preview-header h3{color:#3b82f6;font-size:.9em}
.canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;position:relative}
.canvas-wrap canvas{max-width:100%;max-height:100%}
.controls-section{max-height:200px;overflow-y:auto;border-top:1px solid #334155;padding:10px 12px}
.controls-section h4{color:#3b82f6;font-size:.85em;margin-bottom:8px}
.console-section{height:140px;border-top:1px solid #334155;display:flex;flex-direction:column}
.console-header{padding:6px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155}
.console-header h4{color:#3b82f6;font-size:.85em}
.console-output{flex:1;overflow-y:auto;padding:8px 12px;font-family:'Menlo','Monaco','Courier New',monospace;font-size:.78em;color:#10b981;background:#020617}
.console-line{margin:1px 0}.console-line.error{color:#ef4444}.console-line.warn{color:#f59e0b}
/* CODE MODE */
.code-editor-panel{display:none;flex:1;flex-direction:column}
.code-editor-panel.active{display:flex}
.code-editor-panel textarea{flex:1;background:#020617;color:#e2e8f0;border:none;padding:16px;font-family:'Menlo','Monaco','Courier New',monospace;font-size:.85em;resize:none;tab-size:2}
.code-editor-panel textarea:focus{outline:none}
/* Minimap */
.minimap{position:absolute;bottom:10px;right:10px;width:150px;height:100px;background:rgba(30,41,59,.9);border:1px solid #334155;border-radius:6px;z-index:50;overflow:hidden}
.minimap canvas{width:100%;height:100%}
/* Slider controls */
.ctrl-group{margin-bottom:10px}.ctrl-label{color:#94a3b8;font-size:.8em;display:flex;justify-content:space-between;margin-bottom:3px}
.ctrl-slider{width:100%;accent-color:#3b82f6;height:4px}
/* View only */
body.view-only .studio-sidebar,body.view-only .tb-edit-only,body.view-only .pb-delete{display:none!important}
body.view-only .studio-toolbar{justify-content:center}
</style>
</head>
<body>
<!-- TOOLBAR -->
<div class="studio-toolbar" id="toolbar">
  <span class="brand">🧪 Simulator Studio</span>
  <button class="tb-primary" onclick="runSim()">▶ Run</button>
  <button class="tb-secondary" onclick="stopSim()">⏹ Stop</button>
  <button class="tb-secondary tb-edit-only" onclick="clearAll()">🗑 Clear</button>
  <button class="tb-secondary tb-edit-only" onclick="saveSim()">💾 Save</button>
  <button class="tb-success tb-edit-only" onclick="publishSim()">📤 Publish</button>
  <button class="tb-warning tb-edit-only" onclick="toggleCodeMode()">💻 Code Mode</button>
  <span class="tb-spacer"></span>
  <button class="tb-secondary tb-edit-only" onclick="undoAction()">↩ Undo</button>
  <button class="tb-secondary tb-edit-only" onclick="redoAction()">↪ Redo</button>
  <button class="tb-danger" onclick="exitStudio()" style="margin-left:8px">✕ Exit</button>
</div>
<!-- MAIN -->
<div class="studio-main">
  <!-- SIDEBAR -->
  <div class="studio-sidebar" id="sidebar">
    <div class="sidebar-search"><input type="text" id="blockSearch" placeholder="🔍 Search blocks..." oninput="filterBlocks(this.value)"/></div>
    <div class="block-palette" id="blockPalette"></div>
  </div>
  <!-- WORKSPACE -->
  <div class="workspace-container" id="workspaceContainer">
    <div class="workspace" id="workspace"><svg class="connections" id="connSvg"></svg></div>
    <div class="minimap" id="minimap"><canvas id="minimapCanvas" width="150" height="100"></canvas></div>
  </div>
  <!-- CODE EDITOR (hidden by default) -->
  <div class="code-editor-panel" id="codePanel">
    <div style="padding:8px 12px;background:#1e293b;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center">
      <span style="color:#3b82f6;font-weight:600;font-size:.9em">JavaScript Code</span>
      <button class="tb-secondary" onclick="toggleCodeMode()" style="font-size:.8em">← Back to Blocks</button>
    </div>
    <textarea id="codeEditor" spellcheck="false" placeholder="// Your simulator code here...
// Use the VeeSimLib API:
//   sim.ctx, sim.canvas, sim.width, sim.height
//   sim.mouse.x, sim.mouse.y, sim.mouse.down
//   sim.keys[keyName], sim.dt, sim.frame
//   sim.drawCircle(x,y,r,color), sim.drawRect(x,y,w,h,color)
//   sim.addSlider(name,min,max,def), sim.addButton(label,fn)
//   sim.physics.applyGravity(obj,g), sim.physics.checkCollision(a,b)
"></textarea>
  </div>
  <!-- RIGHT PANEL -->
  <div class="right-panel" id="rightPanel">
    <div class="preview-section">
      <div class="preview-header"><h3>Preview</h3><span id="fpsDisplay" style="color:#64748b;font-size:.75em">0 FPS</span></div>
      <div class="canvas-wrap"><canvas id="simCanvas" width="400" height="400"></canvas></div>
    </div>
    <div class="controls-section" id="controlsSection"><h4>🎛️ Controls</h4><div id="slidersBox"><p style="color:#64748b;font-size:.8em;font-style:italic">No interactive controls yet</p></div></div>
    <div class="console-section">
      <div class="console-header"><h4>Console</h4><button class="tb-secondary" onclick="clearConsole()" style="font-size:.7em;padding:2px 8px">Clear</button></div>
      <div class="console-output" id="consoleOut"></div>
    </div>
  </div>
</div>

<script src="block-templates-unified.js"></script>
<script>
// ===== STUDIO CONFIG =====
const API_BASE_URL=(()=>{if(location.hostname.includes('veelearn.org'))return'https://api.veelearn.org';if(location.hostname.includes('github.io'))return'https://veelearn.onrender.com';if(location.hostname==='localhost'||location.hostname==='127.0.0.1')return'http://localhost:3000';return location.origin})();

// ===== STATE =====
let blocks=[],connections=[],selectedBlockIds=new Set(),dragState=null,connDrag=null;
let blockIdCounter=0,isRunning=false,animFrame=null,frameCount=0,lastTime=0;
let wsOffsetX=0,wsOffsetY=0,wsScale=1,isPanning=false,panStart={x:0,y:0};
let undoStack=[],redoStack=[],inCodeMode=false,isViewOnly=false;
let sliderValues={};

const canvas=document.getElementById('simCanvas');
const simCtx=canvas.getContext('2d');
const ws=document.getElementById('workspace');
const wsContainer=document.getElementById('workspaceContainer');
const connSvg=document.getElementById('connSvg');

// ===== BLOCK DEFINITIONS (extends blockTemplates) =====
const studioBlocks={
// Motion
'move-xy':{title:'Move X/Y',cat:'Motion',inputs:[{n:'dx',l:'Delta X',t:'number',d:5},{n:'dy',l:'Delta Y',t:'number',d:0}],outputs:['x','y'],exec:(i,s)=>({x:(s._x||0)+i.dx,y:(s._y||0)+i.dy})},
'set-position':{title:'Set Position',cat:'Motion',inputs:[{n:'x',l:'X',t:'number',d:200},{n:'y',l:'Y',t:'number',d:200}],outputs:['x','y'],exec:i=>({x:i.x,y:i.y})},
'glide-to':{title:'Glide To',cat:'Motion',inputs:[{n:'x',l:'Target X',t:'number',d:300},{n:'y',l:'Target Y',t:'number',d:200},{n:'speed',l:'Speed',t:'number',d:2}],outputs:['x','y'],exec:(i,s)=>{let cx=s._x||0,cy=s._y||0;let dx=i.x-cx,dy=i.y-cy,d=Math.sqrt(dx*dx+dy*dy);if(d<i.speed)return{x:i.x,y:i.y};return{x:cx+dx/d*i.speed,y:cy+dy/d*i.speed}}},
'rotate':{title:'Rotate',cat:'Motion',inputs:[{n:'angle',l:'Angle (deg)',t:'number',d:15}],outputs:['angle'],exec:(i,s)=>({angle:((s._angle||0)+i.angle)%360})},
'set-scale':{title:'Set Scale',cat:'Motion',inputs:[{n:'sx',l:'Scale X',t:'number',d:1},{n:'sy',l:'Scale Y',t:'number',d:1}],outputs:['sx','sy'],exec:i=>({sx:i.sx,sy:i.sy})},
'bounce-edge':{title:'Bounce Off Edge',cat:'Motion',inputs:[{n:'x',l:'X',t:'number',d:200},{n:'y',l:'Y',t:'number',d:200},{n:'vx',l:'Vel X',t:'number',d:3},{n:'vy',l:'Vel Y',t:'number',d:2},{n:'r',l:'Radius',t:'number',d:20}],outputs:['x','y','vx','vy'],exec:(i,s)=>{let vx=i.vx,vy=i.vy,x=i.x+vx,y=i.y+vy,c=s.canvas;if(c){if(x-i.r<0||x+i.r>c.width)vx=-vx;if(y-i.r<0||y+i.r>c.height)vy=-vy}return{x:x,y:y,vx,vy}}},
// Drawing (extend existing)
'draw-ellipse':{title:'Draw Ellipse',cat:'Drawing',inputs:[{n:'x',l:'X',t:'number',d:200},{n:'y',l:'Y',t:'number',d:200},{n:'rx',l:'Radius X',t:'number',d:60},{n:'ry',l:'Radius Y',t:'number',d:40},{n:'color',l:'Color',t:'text',d:'#8b5cf6'}],outputs:[],exec:(i,s)=>{if(s.ctx){s.ctx.fillStyle=i.color;s.ctx.beginPath();s.ctx.ellipse(i.x,i.y,i.rx,i.ry,0,0,Math.PI*2);s.ctx.fill()}return{}}},
'draw-image':{title:'Draw Image/Sprite',cat:'Drawing',inputs:[{n:'url',l:'Image URL',t:'text',d:''},{n:'x',l:'X',t:'number',d:100},{n:'y',l:'Y',t:'number',d:100},{n:'w',l:'Width',t:'number',d:64},{n:'h',l:'Height',t:'number',d:64}],outputs:[],exec:(i,s)=>{if(s.ctx&&i.url){if(!s._imgCache)s._imgCache={};if(!s._imgCache[i.url]){let img=new Image();img.src=i.url;s._imgCache[i.url]=img}let img=s._imgCache[i.url];if(img.complete)s.ctx.drawImage(img,i.x,i.y,i.w,i.h)}return{}}},
'set-fill':{title:'Set Fill Color',cat:'Drawing',inputs:[{n:'color',l:'Color',t:'text',d:'#3b82f6'}],outputs:['color'],exec:(i,s)=>{if(s.ctx)s.ctx.fillStyle=i.color;return{color:i.color}}},
'set-stroke':{title:'Set Stroke',cat:'Drawing',inputs:[{n:'color',l:'Color',t:'text',d:'#f1f5f9'},{n:'width',l:'Width',t:'number',d:2}],outputs:[],exec:(i,s)=>{if(s.ctx){s.ctx.strokeStyle=i.color;s.ctx.lineWidth=i.width}return{}}},
'draw-bezier':{title:'Draw Bezier Curve',cat:'Drawing',inputs:[{n:'x1',l:'Start X',t:'number',d:50},{n:'y1',l:'Start Y',t:'number',d:200},{n:'cx1',l:'Control 1 X',t:'number',d:150},{n:'cy1',l:'Control 1 Y',t:'number',d:50},{n:'cx2',l:'Control 2 X',t:'number',d:250},{n:'cy2',l:'Control 2 Y',t:'number',d:350},{n:'x2',l:'End X',t:'number',d:350},{n:'y2',l:'End Y',t:'number',d:200},{n:'color',l:'Color',t:'text',d:'#10b981'}],outputs:[],exec:(i,s)=>{if(s.ctx){s.ctx.strokeStyle=i.color;s.ctx.lineWidth=2;s.ctx.beginPath();s.ctx.moveTo(i.x1,i.y1);s.ctx.bezierCurveTo(i.cx1,i.cy1,i.cx2,i.cy2,i.x2,i.y2);s.ctx.stroke()}return{}}},
'shadow-effect':{title:'Shadow Effect',cat:'Drawing',inputs:[{n:'color',l:'Color',t:'text',d:'rgba(0,0,0,0.5)'},{n:'blur',l:'Blur',t:'number',d:10},{n:'ox',l:'Offset X',t:'number',d:3},{n:'oy',l:'Offset Y',t:'number',d:3}],outputs:[],exec:(i,s)=>{if(s.ctx){s.ctx.shadowColor=i.color;s.ctx.shadowBlur=i.blur;s.ctx.shadowOffsetX=i.ox;s.ctx.shadowOffsetY=i.oy}return{}}},
// 3D (isometric projection)
'draw-cube':{title:'Draw 3D Cube',cat:'3D',inputs:[{n:'x',l:'X',t:'number',d:200},{n:'y',l:'Y',t:'number',d:200},{n:'size',l:'Size',t:'number',d:50},{n:'color',l:'Color',t:'text',d:'#3b82f6'},{n:'angle',l:'Rotation',t:'number',d:30}],outputs:[],exec:(i,s)=>{if(!s.ctx)return{};let c=s.ctx,sz=i.size,a=i.angle*Math.PI/180;let dx=Math.cos(a)*sz*.5,dy=Math.sin(a)*sz*.3;let pts=[[i.x-sz/2,i.y],[i.x+sz/2,i.y],[i.x+sz/2+dx,i.y-dy],[i.x-sz/2+dx,i.y-dy]];c.fillStyle=i.color;c.beginPath();pts.forEach((p,idx)=>idx===0?c.moveTo(p[0],p[1]):c.lineTo(p[0],p[1]));c.closePath();c.fill();c.strokeStyle='rgba(255,255,255,.3)';c.stroke();let top=pts.map(p=>[p[0],p[1]-sz]);c.fillStyle=shadeColor(i.color,.3);c.beginPath();c.moveTo(pts[2][0],pts[2][1]);c.lineTo(pts[3][0],pts[3][1]);c.lineTo(top[3][0],top[3][1]);c.lineTo(top[2][0],top[2][1]);c.closePath();c.fill();c.stroke();c.fillStyle=shadeColor(i.color,-.2);c.beginPath();c.moveTo(pts[1][0],pts[1][1]);c.lineTo(pts[2][0],pts[2][1]);c.lineTo(top[2][0],top[2][1]);c.lineTo(top[1][0],top[1][1]);c.closePath();c.fill();c.stroke();return{}}},
'draw-sphere':{title:'Draw 3D Sphere',cat:'3D',inputs:[{n:'x',l:'X',t:'number',d:200},{n:'y',l:'Y',t:'number',d:200},{n:'r',l:'Radius',t:'number',d:40},{n:'color',l:'Color',t:'text',d:'#06b6d4'}],outputs:[],exec:(i,s)=>{if(!s.ctx)return{};let c=s.ctx,g=c.createRadialGradient(i.x-i.r*.3,i.y-i.r*.3,i.r*.1,i.x,i.y,i.r);g.addColorStop(0,'#fff');g.addColorStop(.3,i.color);g.addColorStop(1,shadeColor(i.color,-.5));c.fillStyle=g;c.beginPath();c.arc(i.x,i.y,i.r,0,Math.PI*2);c.fill();return{}}},
'draw-cylinder':{title:'Draw Cylinder',cat:'3D',inputs:[{n:'x',l:'X',t:'number',d:200},{n:'y',l:'Y',t:'number',d:200},{n:'r',l:'Radius',t:'number',d:30},{n:'h',l:'Height',t:'number',d:80},{n:'color',l:'Color',t:'text',d:'#f59e0b'}],outputs:[],exec:(i,s)=>{if(!s.ctx)return{};let c=s.ctx;c.fillStyle=shadeColor(i.color,-.2);c.beginPath();c.ellipse(i.x,i.y+i.h/2,i.r,i.r*.4,0,0,Math.PI*2);c.fill();c.fillStyle=i.color;c.fillRect(i.x-i.r,i.y-i.h/2,i.r*2,i.h);c.beginPath();c.ellipse(i.x,i.y-i.h/2,i.r,i.r*.4,0,Math.PI,Math.PI*2);c.fill();c.fillStyle=shadeColor(i.color,.3);c.beginPath();c.ellipse(i.x,i.y-i.h/2,i.r,i.r*.4,0,0,Math.PI*2);c.fill();return{}}},
'set-camera':{title:'Set Camera/Perspective',cat:'3D',inputs:[{n:'fov',l:'FOV',t:'number',d:60},{n:'dist',l:'Distance',t:'number',d:500}],outputs:['fov','dist'],exec:i=>({fov:i.fov,dist:i.dist})},
// Physics (extend existing)
'apply-force':{title:'Apply Force',cat:'Physics',inputs:[{n:'fx',l:'Force X',t:'number',d:0},{n:'fy',l:'Force Y',t:'number',d:10},{n:'mass',l:'Mass',t:'number',d:1}],outputs:['ax','ay'],exec:i=>({ax:i.fx/i.mass,ay:i.fy/i.mass})},
'projectile':{title:'Projectile Motion',cat:'Physics',inputs:[{n:'x',l:'X',t:'number',d:50},{n:'y',l:'Y',t:'number',d:350},{n:'vx',l:'Vel X',t:'number',d:5},{n:'vy',l:'Vel Y',t:'number',d:-15},{n:'g',l:'Gravity',t:'number',d:.5},{n:'dt',l:'Delta T',t:'number',d:1}],outputs:['x','y','vx','vy'],exec:i=>({x:i.x+i.vx*i.dt,y:i.y+i.vy*i.dt+.5*i.g*i.dt*i.dt,vx:i.vx,vy:i.vy+i.g*i.dt})},
'pendulum':{title:'Pendulum',cat:'Physics',inputs:[{n:'cx',l:'Pivot X',t:'number',d:200},{n:'cy',l:'Pivot Y',t:'number',d:50},{n:'len',l:'Length',t:'number',d:150},{n:'angle',l:'Angle (deg)',t:'number',d:45},{n:'angVel',l:'Angular Vel',t:'number',d:0},{n:'g',l:'Gravity',t:'number',d:.5},{n:'damping',l:'Damping',t:'number',d:.999}],outputs:['x','y','angle','angVel'],exec:i=>{let a=i.angle*Math.PI/180,av=i.angVel-i.g/i.len*Math.sin(a);av*=i.damping;a+=av;return{x:i.cx+Math.sin(a)*i.len,y:i.cy+Math.cos(a)*i.len,angle:a*180/Math.PI,angVel:av}}},

// ===== HELPER =====
function shadeColor(c,p){let f=parseInt(c.slice(1),16),t=p<0?0:255,P=p<0?p*-1:p,R=f>>16,G=f>>8&0xFF,B=f&0xFF;return'#'+(0x1000000+(Math.round((t-R)*P)+R)*0x10000+(Math.round((t-G)*P)+G)*0x100+(Math.round((t-B)*P)+B)).toString(16).slice(1)}
function escapeHtml(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function log(msg,type='info'){const el=document.getElementById('consoleOut');const d=document.createElement('div');d.className='console-line '+(type||'');d.textContent='> '+msg;el.appendChild(d);el.scrollTop=el.scrollHeight;while(el.children.length>80)el.removeChild(el.firstChild)}
function clearConsole(){document.getElementById('consoleOut').innerHTML=''}

// ===== BUILD PALETTE =====
function buildPalette(){
  const pal=document.getElementById('blockPalette');
  pal.innerHTML='';
  categories.forEach(cat=>{
    const div=document.createElement('div');
    div.className='palette-category open';
    div.dataset.cat=cat.name;
    let itemsHtml='';
    cat.blocks.forEach(btype=>{
      const tmpl=allTemplates[btype];
      if(!tmpl)return;
      itemsHtml+=`<div class="palette-block ${cat.css}" draggable="true" data-type="${btype}">${tmpl.title||btype}</div>`;
    });
    div.innerHTML=`<div class="palette-category-header" onclick="this.parentElement.classList.toggle('open')">${cat.icon} ${cat.name} <span>▾</span></div><div class="palette-category-items">${itemsHtml}</div>`;
    pal.appendChild(div);
  });
  setupPaletteDrag();
}

function filterBlocks(q){
  q=q.toLowerCase();
  document.querySelectorAll('.palette-category').forEach(cat=>{
    let any=false;
    cat.querySelectorAll('.palette-block').forEach(b=>{
      const match=b.textContent.toLowerCase().includes(q)||b.dataset.type.includes(q);
      b.style.display=match?'':'none';
      if(match)any=true;
    });
    cat.style.display=any?'':'none';
    if(q&&any)cat.classList.add('open');
  });
}

// ===== PALETTE DRAG =====
let paletteDrag=null;
function setupPaletteDrag(){
  document.querySelectorAll('.palette-block').forEach(b=>{
    b.addEventListener('dragstart',e=>{
      if(isViewOnly)return;
      paletteDrag={type:e.target.dataset.type};
      e.dataTransfer.effectAllowed='copy';
    });
  });
}

// ===== WORKSPACE EVENTS =====
wsContainer.addEventListener('dragover',e=>{if(isViewOnly)return;e.preventDefault();e.dataTransfer.dropEffect='copy'});
wsContainer.addEventListener('drop',e=>{
  if(isViewOnly||!paletteDrag)return;
  e.preventDefault();
  const rect=wsContainer.getBoundingClientRect();
  const x=(e.clientX-rect.left-wsOffsetX)/wsScale;
  const y=(e.clientY-rect.top-wsOffsetY)/wsScale;
  pushUndo();
  addBlock(paletteDrag.type,x,y);
  paletteDrag=null;
});

// Pan & Zoom
wsContainer.addEventListener('wheel',e=>{
  e.preventDefault();
  const delta=e.deltaY>0?0.9:1.1;
  wsScale=Math.max(0.2,Math.min(3,wsScale*delta));
  applyTransform();
},{passive:false});

wsContainer.addEventListener('mousedown',e=>{
  if(e.button===1||(e.button===0&&e.altKey)){isPanning=true;panStart={x:e.clientX-wsOffsetX,y:e.clientY-wsOffsetY};e.preventDefault()}
});
document.addEventListener('mousemove',e=>{
  if(isPanning){wsOffsetX=e.clientX-panStart.x;wsOffsetY=e.clientY-panStart.y;applyTransform()}
  if(dragState)handleBlockDrag(e);
  if(connDrag)handleConnDrag(e);
  // Track mouse for canvas
  const cr=canvas.getBoundingClientRect();
  mouseState.x=e.clientX-cr.left;mouseState.y=e.clientY-cr.top;
});
document.addEventListener('mouseup',e=>{
  isPanning=false;
  if(dragState){dragState.el.classList.remove('dragging');dragState=null}
  if(connDrag)finishConnDrag(e);
});
canvas.addEventListener('mousedown',()=>{mouseState.down=true});
canvas.addEventListener('mouseup',()=>{mouseState.down=false});

let mouseState={x:0,y:0,down:false};
let keysDown={};
document.addEventListener('keydown',e=>{
  keysDown[e.key]=true;
  if(e.ctrlKey&&e.key==='z'&&!e.shiftKey){e.preventDefault();undoAction()}
  if(e.ctrlKey&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();redoAction()}
  if(e.ctrlKey&&e.key==='s'){e.preventDefault();saveSim()}
  if(e.ctrlKey&&e.key==='r'){e.preventDefault();runSim()}
  if(e.key==='Delete')deleteSelected();
});
document.addEventListener('keyup',e=>{keysDown[e.key]=false});

function applyTransform(){ws.style.transform=`translate(${wsOffsetX}px,${wsOffsetY}px) scale(${wsScale})`; ws.style.transformOrigin='0 0';updateMinimap()}

// ===== BLOCK CRUD =====
function addBlock(type,x,y){
  const tmpl=allTemplates[type];
  if(!tmpl){log(`Block type '${type}' not found`,'error');return null}
  const b={id:blockIdCounter++,type,x:x||100,y:y||100,inputs:{}};
  if(tmpl.inputs){
    const inp=tmpl.inputs.map?tmpl.inputs:Object.values(tmpl.inputs);
    inp.forEach(i=>{b.inputs[i.n||i.name]=(i.d!==undefined?i.d:(i.default!==undefined?i.default:''))});
  }
  blocks.push(b);
  renderBlock(b);
  log(`Added ${tmpl.title||type}`);
  return b;
}

function renderBlock(b){
  const tmpl=allTemplates[b.type];
  if(!tmpl)return;
  const cat=categories.find(c=>c.blocks.includes(b.type));
  const catCss=cat?cat.css:'cat-math';
  const el=document.createElement('div');
  el.className='placed-block';
  el.dataset.id=b.id;
  el.style.left=b.x+'px';el.style.top=b.y+'px';

  // Determine inputs array format
  const inputs=tmpl.inputs?(tmpl.inputs.map?tmpl.inputs:Object.values(tmpl.inputs)):[];
  const outputs=tmpl.outputs||[];

  let inputsHtml='';
  inputs.forEach(inp=>{
    const name=inp.n||inp.name;
    const label=inp.l||inp.label||name;
    const val=b.inputs[name]!==undefined?b.inputs[name]:(inp.d!==undefined?inp.d:inp.default||'');
    inputsHtml+=`<div class="pb-input-row"><div class="conn-point input" data-block-id="${b.id}" data-input="${name}"></div><span class="pb-input-label">${escapeHtml(label)}</span><input class="pb-input" data-bid="${b.id}" data-inp="${name}" value="${escapeHtml(String(val))}" type="${(inp.t||inp.type)==='text'?'text':'number'}" ${(inp.t||inp.type)==='number'?'step="any"':''}></div>`;
  });

  let outputHtml='';
  if(outputs.length){outputHtml=`<div class="conn-point output" data-block-id="${b.id}" data-output="${outputs[0]}" style="top:24px"></div>`}

  el.innerHTML=`<div class="pb-header ${catCss}"><span class="pb-title">${escapeHtml(tmpl.title||b.type)}</span><button class="pb-delete" onclick="pushUndo();deleteBlock(${b.id})">✕</button></div><div class="pb-body">${inputsHtml}</div>${outputHtml}`;

  // Block drag
  const header=el.querySelector('.pb-header');
  header.addEventListener('mousedown',e=>{
    if(isViewOnly||e.target.closest('.pb-delete'))return;
    selectedBlockIds.clear();selectedBlockIds.add(b.id);highlightSelected();
    const rect=wsContainer.getBoundingClientRect();
    dragState={id:b.id,el,ox:e.clientX/wsScale-b.x,oy:e.clientY/wsScale-b.y};
    el.classList.add('dragging');
    e.stopPropagation();
  });

  // Connection drag from output
  el.querySelectorAll('.conn-point.output').forEach(cp=>{
    cp.addEventListener('mousedown',e=>{
      if(isViewOnly)return;
      e.stopPropagation();e.preventDefault();
      connDrag={fromId:b.id,output:cp.dataset.output,startX:0,startY:0};
      const br=cp.getBoundingClientRect(),wr=wsContainer.getBoundingClientRect();
      connDrag.startX=(br.left+br.width/2-wr.left-wsOffsetX)/wsScale;
      connDrag.startY=(br.top+br.height/2-wr.top-wsOffsetY)/wsScale;
      // temp line
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('stroke','#3b82f6');path.setAttribute('stroke-width','2');
      path.setAttribute('stroke-dasharray','6,4');path.setAttribute('fill','none');
      path.id='tempConn';connSvg.appendChild(path);
    });
  });

  // Input changes
  el.querySelectorAll('.pb-input').forEach(inp=>{
    inp.addEventListener('input',e=>{
      const bid=parseInt(e.target.dataset.bid),name=e.target.dataset.inp;
      const blk=blocks.find(bl=>bl.id===bid);
      if(blk)blk.inputs[name]=isNaN(e.target.value)?e.target.value:parseFloat(e.target.value);
    });
  });

  ws.appendChild(el);
}

function handleBlockDrag(e){
  if(!dragState)return;
  const b=blocks.find(bl=>bl.id===dragState.id);
  if(!b)return;
  b.x=e.clientX/wsScale-dragState.ox;
  b.y=e.clientY/wsScale-dragState.oy;
  dragState.el.style.left=b.x+'px';dragState.el.style.top=b.y+'px';
  drawConnections();
}

function handleConnDrag(e){
  if(!connDrag)return;
  const path=document.getElementById('tempConn');
  if(!path)return;
  const wr=wsContainer.getBoundingClientRect();
  const mx=(e.clientX-wr.left-wsOffsetX)/wsScale;
  const my=(e.clientY-wr.top-wsOffsetY)/wsScale;
  const sx=connDrag.startX,sy=connDrag.startY;
  const mid=(sx+mx)/2;
  path.setAttribute('d',`M ${sx} ${sy} C ${mid} ${sy}, ${mid} ${my}, ${mx} ${my}`);
}

function finishConnDrag(e){
  if(!connDrag)return;
  const tmp=document.getElementById('tempConn');
  if(tmp)tmp.remove();
  // Check if dropped on input point
  const target=document.elementFromPoint(e.clientX,e.clientY);
  if(target&&target.classList.contains('conn-point')&&target.classList.contains('input')){
    const toId=parseInt(target.dataset.blockId);
    const toInput=target.dataset.input;
    if(toId!==connDrag.fromId){
      pushUndo();
      connections=connections.filter(c=>!(c.to===toId&&c.toInput===toInput));
      connections.push({from:connDrag.fromId,fromOutput:connDrag.output,to:toId,toInput:toInput});
      drawConnections();
      log(`Connected ${connDrag.fromId} → ${toId}`);
    }
  }
  connDrag=null;
}

function drawConnections(){
  connSvg.innerHTML='';
  connections.forEach(c=>{
    const fromEl=ws.querySelector(`[data-id="${c.from}"]`);
    const toEl=ws.querySelector(`[data-id="${c.to}"]`);
    if(!fromEl||!toEl)return;
    const outPt=fromEl.querySelector('.conn-point.output');
    const inPt=toEl.querySelector(`.conn-point.input[data-input="${c.toInput}"]`);
    if(!outPt||!inPt)return;
    const x1=fromEl.offsetLeft+fromEl.offsetWidth;
    const y1=fromEl.offsetTop+(outPt.offsetTop||24)+5;
    const x2=toEl.offsetLeft;
    const y2=toEl.offsetTop+(inPt.offsetTop||24)+5;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    const mid=(x1+x2)/2;
    path.setAttribute('d',`M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`);
    path.setAttribute('stroke','#10b981');path.setAttribute('stroke-width','2');path.setAttribute('fill','none');
    connSvg.appendChild(path);
  });
}

function deleteBlock(id){
  blocks=blocks.filter(b=>b.id!==id);
  connections=connections.filter(c=>c.from!==id&&c.to!==id);
  const el=ws.querySelector(`[data-id="${id}"]`);
  if(el)el.remove();
  drawConnections();log(`Deleted block ${id}`);
}

function deleteSelected(){
  if(selectedBlockIds.size===0)return;
  pushUndo();
  selectedBlockIds.forEach(id=>deleteBlock(id));
  selectedBlockIds.clear();
}

function highlightSelected(){
  ws.querySelectorAll('.placed-block').forEach(el=>{
    el.classList.toggle('selected',selectedBlockIds.has(parseInt(el.dataset.id)));
  });
}

function renderAll(){
  ws.querySelectorAll('.placed-block').forEach(el=>el.remove());
  blocks.forEach(b=>renderBlock(b));
  drawConnections();
}

function clearAll(){
  if(isViewOnly)return;
  if(blocks.length&&!confirm('Clear all blocks?'))return;
  pushUndo();
  blocks=[];connections=[];blockIdCounter=0;
  ws.querySelectorAll('.placed-block').forEach(el=>el.remove());
  connSvg.innerHTML='';
  clearConsole();log('Workspace cleared');
}

// ===== UNDO/REDO =====
function pushUndo(){undoStack.push(JSON.stringify({blocks,connections}));redoStack=[];if(undoStack.length>50)undoStack.shift()}
function undoAction(){if(!undoStack.length)return;redoStack.push(JSON.stringify({blocks,connections}));const s=JSON.parse(undoStack.pop());blocks=s.blocks;connections=s.connections;renderAll();log('Undo')}
function redoAction(){if(!redoStack.length)return;undoStack.push(JSON.stringify({blocks,connections}));const s=JSON.parse(redoStack.pop());blocks=s.blocks;connections=s.connections;renderAll();log('Redo')}

// ===== MINIMAP =====
function updateMinimap(){
  const mc=document.getElementById('minimapCanvas');
  const mx=mc.getContext('2d');
  mx.fillStyle='#1e293b';mx.fillRect(0,0,150,100);
  if(!blocks.length)return;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  blocks.forEach(b=>{minX=Math.min(minX,b.x);minY=Math.min(minY,b.y);maxX=Math.max(maxX,b.x+180);maxY=Math.max(maxY,b.y+80)});
  const w=maxX-minX||1,h=maxY-minY||1;
  const scale=Math.min(140/w,90/h);
  blocks.forEach(b=>{
    mx.fillStyle='#3b82f6';
    mx.fillRect(5+(b.x-minX)*scale,5+(b.y-minY)*scale,Math.max(4,180*scale),Math.max(3,40*scale));
  });
}

// ===== SIMULATION =====
function runSim(){
  if(isRunning){log('Already running','warn');return}
  if(inCodeMode)return runCodeMode();
  if(!blocks.length){log('No blocks to execute','warn');return}
  isRunning=true;frameCount=0;lastTime=performance.now();
  log('Simulation started');
  const state={ctx:simCtx,canvas,frameCount:0,_mouseX:0,_mouseY:0,_mouseDown:false,_keys:keysDown,_messages:{},_imgCache:{},_chartData:null,_list:[]};
  buildSliders();

  function frame(ts){
    if(!isRunning)return;
    const dt=(ts-lastTime)/1000;lastTime=ts;frameCount++;
    state.frameCount=frameCount;state._mouseX=mouseState.x;state._mouseY=mouseState.y;state._mouseDown=mouseState.down;state._keys=keysDown;
    // Apply slider values
    Object.entries(sliderValues).forEach(([varName,val])=>{
      blocks.filter(b=>b.type==='variable'&&b.inputs.name===varName).forEach(vb=>{vb.inputs.value=val});
      blocks.filter(b=>b.type==='slider'&&b.inputs.variable===varName).forEach(sb=>{sb.inputs.default=val});
    });
    simCtx.fillStyle='#fff';simCtx.fillRect(0,0,canvas.width,canvas.height);
    executeBlocks(state);
    // FPS
    document.getElementById('fpsDisplay').textContent=Math.round(1/dt)+' FPS';
    animFrame=requestAnimationFrame(frame);
  }
  animFrame=requestAnimationFrame(frame);
}

function stopSim(){
  isRunning=false;
  if(animFrame)cancelAnimationFrame(animFrame);
  log('Simulation stopped');
}

function executeBlocks(state){
  const vals=new Map();
  // Simple topological-ish execution
  const executed=new Set();
  // Multiple passes to resolve dependencies
  for(let pass=0;pass<3;pass++){
    for(const b of blocks){
      if(executed.has(b.id))continue;
      const tmpl=allTemplates[b.type];
      if(!tmpl)continue;
      const inputs={};
      const inpDefs=tmpl.inputs?(tmpl.inputs.map?tmpl.inputs:Object.values(tmpl.inputs)):[];
      let ready=true;
      inpDefs.forEach(inp=>{
        const name=inp.n||inp.name;
        const conn=connections.find(c=>c.to===b.id&&c.toInput===name);
        if(conn){
          const fromVal=vals.get(conn.from);
          if(fromVal!==undefined){
            inputs[name]=fromVal[conn.fromOutput]!==undefined?fromVal[conn.fromOutput]:(b.inputs[name]!==undefined?b.inputs[name]:(inp.d!==undefined?inp.d:inp.default));
          }else{
            ready=false;
            inputs[name]=b.inputs[name]!==undefined?b.inputs[name]:(inp.d!==undefined?inp.d:inp.default);
          }
        }else{
          inputs[name]=b.inputs[name]!==undefined?b.inputs[name]:(inp.d!==undefined?inp.d:inp.default);
        }
        if(typeof inputs[name]==='string'&&!isNaN(inputs[name])&&inputs[name]!=='')inputs[name]=parseFloat(inputs[name]);
      });
      try{
        const execFn=tmpl.exec||tmpl.execute;
        const out=execFn?execFn(inputs,state):{};
        vals.set(b.id,out||{});
        executed.add(b.id);
      }catch(err){
        if(frameCount<=1)log(`Error in ${tmpl.title||b.type}: ${err.message}`,'error');
      }
    }
  }
  if(frameCount===1)log(`✓ Executed ${executed.size}/${blocks.length} blocks`);
}

function buildSliders(){
  const box=document.getElementById('slidersBox');
  box.innerHTML='';
  let has=false;
  blocks.forEach(b=>{
    if(b.type!=='slider')return;
    has=true;
    const min=parseFloat(b.inputs.min)||0,max=parseFloat(b.inputs.max)||100,def=parseFloat(b.inputs.default)||50;
    const varName=b.inputs.variable||'var_'+b.id;
    const d=document.createElement('div');d.className='ctrl-group';
    d.innerHTML=`<div class="ctrl-label"><span>${escapeHtml(varName)}</span><span id="sv-${b.id}">${def}</span></div><input type="range" class="ctrl-slider" min="${min}" max="${max}" value="${def}" step="any" data-bid="${b.id}" data-var="${escapeHtml(varName)}">`;
    box.appendChild(d);
    sliderValues[varName]=def;
    d.querySelector('input').addEventListener('input',e=>{
      const v=parseFloat(e.target.value);
      document.getElementById('sv-'+b.id).textContent=v.toFixed(1);
      sliderValues[e.target.dataset.var]=v;
    });
  });
  if(!has)box.innerHTML='<p style="color:#64748b;font-size:.8em;font-style:italic">No interactive controls</p>';
}

// ===== CODE MODE =====
function toggleCodeMode(){
  if(inCodeMode){
    inCodeMode=false;
    document.getElementById('codePanel').classList.remove('active');
    document.getElementById('sidebar').style.display='';
    document.getElementById('workspaceContainer').style.display='';
  }else{
    inCodeMode=true;
    // Generate code from blocks
    document.getElementById('codeEditor').value=generateCode();
    document.getElementById('codePanel').classList.add('active');
    document.getElementById('sidebar').style.display='none';
    document.getElementById('workspaceContainer').style.display='none';
  }
}

function generateCode(){
  let code='// Auto-generated from blocks\n// Edit freely - use VeeSimLib API\n\n';
  code+='function setup(sim) {\n  // Runs once at start\n';
  blocks.filter(b=>b.type==='slider').forEach(b=>{
    code+=`  sim.addSlider("${b.inputs.variable||'var'}",${b.inputs.min||0},${b.inputs.max||100},${b.inputs.default||50});\n`;
  });
  code+='}\n\nfunction draw(sim) {\n  const ctx = sim.ctx;\n  ctx.fillStyle = "#fff";\n  ctx.fillRect(0, 0, sim.width, sim.height);\n\n';
  blocks.forEach(b=>{
    const t=allTemplates[b.type];
    if(!t)return;
    code+=`  // ${t.title||b.type}\n`;
    if(b.type==='draw-circle')code+=`  ctx.fillStyle="${b.inputs.color||'#3b82f6'}"; ctx.beginPath(); ctx.arc(${b.inputs.x||200},${b.inputs.y||200},${b.inputs.radius||50},0,Math.PI*2); ctx.fill();\n`;
    else if(b.type==='draw-rectangle')code+=`  ctx.fillStyle="${b.inputs.color||'#10b981'}"; ctx.fillRect(${b.inputs.x||50},${b.inputs.y||50},${b.inputs.width||100},${b.inputs.height||80});\n`;
    else if(b.type==='draw-line')code+=`  ctx.strokeStyle="${b.inputs.color||'#000'}"; ctx.lineWidth=${b.inputs.width||2}; ctx.beginPath(); ctx.moveTo(${b.inputs.x1||0},${b.inputs.y1||0}); ctx.lineTo(${b.inputs.x2||400},${b.inputs.y2||400}); ctx.stroke();\n`;
    else if(b.type==='draw-text')code+=`  ctx.fillStyle="${b.inputs.color||'#000'}"; ctx.font="${b.inputs.size||16}px sans-serif"; ctx.fillText("${b.inputs.text||'Hello'}",${b.inputs.x||100},${b.inputs.y||200});\n`;
    else code+=`  // Block: ${t.title} (configure manually)\n`;
    code+='\n';
  });
  code+='}\n';
  return code;
}

function runCodeMode(){
  stopSim();
  const code=document.getElementById('codeEditor').value;
  isRunning=true;frameCount=0;lastTime=performance.now();
  log('Running code mode...');
  const sim={ctx:simCtx,canvas,width:canvas.width,height:canvas.height,mouse:mouseState,keys:keysDown,dt:0,frame:0,
    addSlider:(name,min,max,def)=>{sliderValues[name]=def},
    drawCircle:(x,y,r,c)=>{simCtx.fillStyle=c||'#3b82f6';simCtx.beginPath();simCtx.arc(x,y,r,0,Math.PI*2);simCtx.fill()},
    drawRect:(x,y,w,h,c)=>{simCtx.fillStyle=c||'#10b981';simCtx.fillRect(x,y,w,h)},
    physics:{applyGravity:(o,g)=>{o.vy=(o.vy||0)+(g||.5);o.y+=o.vy},checkCollision:(a,b)=>{let d=Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);return d<(a.r||20)+(b.r||20)}},
  };
  try{
    const fn=new Function('sim','setup','draw',code+'\nif(typeof setup==="function")setup(sim);\nreturn draw;');
    const drawFn=fn(sim);
    if(typeof drawFn!=='function'){log('Code must define a draw(sim) function','error');isRunning=false;return}
    function frame(ts){
      if(!isRunning)return;
      sim.dt=(ts-lastTime)/1000;lastTime=ts;sim.frame=++frameCount;
      sim.mouse=mouseState;sim.keys=keysDown;
      try{drawFn(sim)}catch(e){log('Runtime: '+e.message,'error');isRunning=false;return}
      document.getElementById('fpsDisplay').textContent=Math.round(1/sim.dt)+' FPS';
      animFrame=requestAnimationFrame(frame);
    }
    animFrame=requestAnimationFrame(frame);
  }catch(e){log('Compile: '+e.message,'error');isRunning=false}
}

// ===== SAVE / PUBLISH / EXIT =====
function saveSim(){
  if(isViewOnly)return;
  const data={blocks,connections,codeMode:inCodeMode?document.getElementById('codeEditor').value:null,timestamp:new Date().toISOString()};
  // Save to localStorage
  localStorage.setItem('studio-autosave',JSON.stringify(data));
  // Send to parent
  if(window.opener&&!window.opener.closed){
    window.opener.postMessage({type:'save-simulator',data},'*');
    log('Saved to course!');alert('Simulator saved!');
  }else{
    log('Auto-saved locally');alert('Saved to browser storage!');
  }
}

async function publishSim(){
  if(isViewOnly)return;
  const title=prompt('Simulator name:','My Simulator');
  if(!title)return;
  const desc=prompt('Description:','')||'';
  try{
    const resp=await fetch(`${API_BASE_URL}/api/simulators`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'include',
      body:JSON.stringify({title,description:desc,blocks,connections,status:'published',
        code_mode:inCodeMode?document.getElementById('codeEditor').value:null,
        sim_type:inCodeMode?'code':'block'})
    });
    const r=await resp.json();
    if(r.success){
      log(`✓ Published! ID: ${r.data?.simulatorId}`);alert('Published successfully!');
      if(window.opener)window.opener.postMessage({type:'simulator-published',simulatorId:r.data.simulatorId},'*');
    }else throw new Error(r.message||'Publish failed');
  }catch(e){log('Publish failed: '+e.message,'error');alert('Publish failed: '+e.message)}
}

function exitStudio(){
  if(window.opener&&!window.opener.closed){
    window.opener.postMessage({type:'save-simulator',data:{blocks,connections}},'*');
    window.close();
  }else if(window.parent!==window){
    window.parent.postMessage({type:'closeBlockSimulator'},'*');
  }else{
    window.location.href='index.html';
  }
}

// ===== LOAD FROM API / URL =====
async function loadFromUrl(){
  const params=new URLSearchParams(location.search);
  isViewOnly=params.get('viewOnly')==='true'||params.get('embedded')==='true';
  if(isViewOnly)document.body.classList.add('view-only');
  const simId=params.get('simId');
  if(simId){
    try{
      log('Loading simulator #'+simId+'...');
      const resp=await fetch(`${API_BASE_URL}/api/simulators/${simId}`,{credentials:'include'});
      const r=await resp.json();
      if(r.success&&r.data){
        blocks=Array.isArray(r.data.blocks)?r.data.blocks:[];
        connections=Array.isArray(r.data.connections)?r.data.connections:[];
        if(r.data.code_mode){
          document.getElementById('codeEditor').value=typeof r.data.code_mode==='string'?r.data.code_mode:JSON.stringify(r.data.code_mode);
        }
        renderAll();
        log(`Loaded "${r.data.title}" with ${blocks.length} blocks`);
        if(isViewOnly){setTimeout(()=>runSim(),300)}
      }
    }catch(e){log('Load error: '+e.message,'error')}
  }
  // Check for autosave
  if(!simId&&!isViewOnly){
    const saved=localStorage.getItem('studio-autosave');
    if(saved){try{const d=JSON.parse(saved);if(d.blocks&&d.blocks.length&&confirm('Restore last session?')){blocks=d.blocks;connections=d.connections||[];renderAll();log('Restored from autosave')}}catch(e){}}
  }
}

// Load from parent postMessage
window.addEventListener('message',e=>{
  if(e.data.type==='load-simulator'){
    blocks=e.data.data?.blocks||e.data.blocks||[];
    connections=e.data.data?.connections||e.data.connections||[];
    renderAll();
    log(`Loaded ${blocks.length} blocks from parent`);
    if(isViewOnly)setTimeout(()=>runSim(),200);
  }
});

// Autosave
setInterval(()=>{
  if(!isViewOnly&&blocks.length){
    localStorage.setItem('studio-autosave',JSON.stringify({blocks,connections,codeMode:inCodeMode?document.getElementById('codeEditor').value:null,timestamp:new Date().toISOString()}));
  }
},30000);

// ===== INIT =====
buildPalette();
loadFromUrl();
log('Simulator Studio ready! Drag blocks from the palette to get started.');
log('Shortcuts: Ctrl+S save, Ctrl+Z undo, Ctrl+R run, Del delete, Alt+drag pan, scroll zoom');
updateMinimap();
</script>
