<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Signup - Veelearn</title>
    <link rel="icon" type="image/png" href="VEELEARN.png">
    <link rel="stylesheet" href="luxury-editorial.css">
    <link rel="stylesheet" href="styles-redesign.css">
    <link rel="stylesheet" href="theme-toggle.css">
    <style>
        body {
            background: #f8fafc;
        }
        .signup-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border: 1px solid #e5e7eb;
        }
        .signup-container h1 {
            color: #1e293b;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            color: #1e293b;
            font-size: 16px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: #dc2626;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }
        .success-message {
            color: #16a34a;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }
        .info-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .info-box p {
            color: #4b5563;
            font-size: 14px;
            margin: 0;
        }
        .parent-code-display {
            background: #667eea;
            color: white;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            display: none;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h1>🎓 Student Signup</h1>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <div class="parent-code-display" id="parentCodeDisplay"></div>
        
        <div class="info-box">
            <p><strong>Note:</strong> Enter a school code to register as a student. Leave it blank to register as a regular user.</p>
        </div>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <small style="color: #888; font-size: 12px;">Must be at least 8 characters with uppercase, lowercase, and number</small>
            </div>
            
            <div class="form-group">
                <label for="school_code">School Code (Required)</label>
                <input type="text" id="school_code" name="school_code" required placeholder="Enter your school's access code">
                <small style="color: #888; font-size: 12px;">Get this code from your school administrator</small>
            </div>

            <div class="form-group">
                <label for="class_code">Class Code (Optional)</label>
                <input type="text" id="class_code" name="class_code" placeholder="Enter class ID to auto-enroll">
                <small style="color: #888; font-size: 12px;">Get this from your teacher to auto-enroll in a class</small>
            </div>
            
            <button type="submit" class="btn-submit">Register</button>
        </form>
        
        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script>
        const API_BASE_URL = (() => {
            if (window.location.hostname.includes('veelearn.org')) {
                return 'https://api.veelearn.org';
            }
            if (window.location.hostname.includes('github.io')) {
                return 'https://veelearn.onrender.com';
            }
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'http://localhost:3000';
            }
            return window.location.origin;
        })();

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const parentCodeDisplay = document.getElementById('parentCodeDisplay');
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            parentCodeDisplay.style.display = 'none';
            
            const school_code = document.getElementById('school_code').value;
            const class_code = document.getElementById('class_code').value;
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                school_code: school_code ? school_code.toUpperCase() : null,
                class_code: class_code ? class_code : null
            };
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/register/student`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    const isStudent = data.data && data.data.role === 'student';
                    
                    if (isStudent && data.data.parent_code) {
                        successMessage.textContent = 'Registration successful! Save your parent code:';
                        successMessage.style.display = 'block';
                        parentCodeDisplay.textContent = data.data.parent_code;
                        parentCodeDisplay.style.display = 'block';
                    } else {
                        successMessage.textContent = data.message || 'Registration successful!';
                        successMessage.style.display = 'block';
                    }
                    
                    document.getElementById('signupForm').reset();
                    
                    // Redirect to login after 5 seconds if student (to give time to save parent code)
                    // or 2 seconds if regular user
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, isStudent ? 5000 : 2000);
                } else {
                    errorMessage.textContent = data.message || 'Registration failed. Please try again.';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                errorMessage.textContent = 'Network error. Please check your connection and try again.';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
