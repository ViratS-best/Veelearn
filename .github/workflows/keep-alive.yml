name: Server Keep-Alive Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
    - name: Debug Workflow Trigger
      run: |
        echo "🔍 Workflow triggered at: $(date)"
        echo "🔍 GitHub event: ${{ github.event_name }}"
        echo "🔍 Repository: ${{ github.repository }}"
        echo "🔍 Ref: ${{ github.ref }}"
        
    - name: Keep Server Alive
      run: |
        echo "🔄 Starting server keep-alive ping..."
        echo "⏰ Current time: $(date)"
        
        RENDER_URL="https://api.veelearn.org/api/health"
        echo "🌐 Pinging URL: $RENDER_URL"
        
        response=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL")
        
        if [ "$response" = "200" ]; then
          echo "✅ Server is awake and healthy (HTTP $response)"
        else
          echo "⚠️ Server responded with HTTP $response - attempting wake-up..."
          sleep 5
          response2=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL")
          
          if [ "$response2" = "200" ]; then
            echo "✅ Server successfully woke up (HTTP $response2)"
          else
            echo "❌ Server still not responding (HTTP $response2)"
            exit 1
          fi
        fi
        
        echo "📊 Response time: $(curl -o /dev/null -s -w '%{time_total}' "$RENDER_URL") seconds"
        
    - name: Log Result
      if: always()
      run: |
        echo "🕐 Keep-alive ping completed at $(date)"
        echo "🌐 Server URL: https://api.veelearn.org"
        echo "⏰ Next scheduled run in 5 minutes"
        echo "📊 Workflow status: ${{ job.status }}"
        
        current_min=$(date +%M)
        next_min=$(( ((current_min / 5) + 1) * 5 ))
        if [ $next_min -eq 60 ]; then
          next_min=0
          echo "🕐 Next cron run: $(date -d '+1 hour' '+%Y-%m-%d %H:00:00') UTC"
        else
          echo "🕐 Next cron run: $(date -d "+$((next_min - current_min)) minutes" '+%Y-%m-%d %H:%M:00') UTC"
        fi