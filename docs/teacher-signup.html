<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Signup - Veelearn</title>
    <link rel="icon" type="image/png" href="VEELEARN.png">
    <link rel="stylesheet" href="luxury-editorial.css">
    <link rel="stylesheet" href="styles-redesign.css">
    <style>
        .signup-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 40px;
            background: #1a1a2e;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .signup-container h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #eee;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 5px;
            color: #eee;
            font-size: 16px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }
        .success-message {
            color: #51cf66;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h1>👨‍🏫 Teacher Signup</h1>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <small style="color: #888; font-size: 12px;">Must be at least 8 characters with uppercase, lowercase, and number</small>
            </div>
            
            <div class="form-group">
                <label for="school_code">School Code</label>
                <input type="text" id="school_code" name="school_code" required placeholder="Enter your school's access code">
                <small style="color: #888; font-size: 12px;">Get this code from your school administrator</small>
            </div>
            
            <button type="submit" class="btn-submit">Register as Teacher</button>
        </form>
        
        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script>
        const API_BASE_URL = (() => {
            if (window.location.hostname.includes('veelearn.org')) {
                return 'https://api.veelearn.org';
            }
            if (window.location.hostname.includes('github.io')) {
                return 'https://veelearn.onrender.com';
            }
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'http://localhost:3000';
            }
            return window.location.origin;
        })();

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                school_code: document.getElementById('school_code').value.toUpperCase()
            };
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/register/teacher`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    successMessage.textContent = data.message || 'Registration successful!';
                    successMessage.style.display = 'block';
                    document.getElementById('signupForm').reset();
                    
                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    errorMessage.textContent = data.message || 'Registration failed. Please check your school code and try again.';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                errorMessage.textContent = 'Network error. Please check your connection and try again.';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
