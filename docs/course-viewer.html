<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Viewer - Veelearn</title>
    <link rel="stylesheet" href="styles-redesign.css">
    <style>
        body {
            background: #0f0f1a;
            color: #eee;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #1a1a2e;
            border-radius: 10px;
        }
        .header h1 {
            color: #667eea;
            margin: 0;
        }
        .btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .course-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #0f3460;
        }
        .course-title {
            color: #667eea;
            margin-bottom: 20px;
        }
        .course-description {
            color: #ccc;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .content-section {
            margin-bottom: 30px;
        }
        .content-section h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        .content-section p {
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .quiz-section {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
        }
        .quiz-section h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        .quiz-question {
            margin-bottom: 20px;
        }
        .quiz-question p {
            color: #eee;
            margin-bottom: 10px;
        }
        .quiz-options button {
            display: block;
            width: 100%;
            padding: 10px 15px;
            margin-bottom: 10px;
            background: #0f3460;
            color: #eee;
            border: 1px solid #1a1a2e;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
        }
        .quiz-options button:hover {
            background: #667eea;
        }
        .quiz-options button.correct {
            background: #51cf66;
        }
        .quiz-options button.incorrect {
            background: #ff6b6b;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Course Viewer</h1>
            <a href="student-dashboard.html" class="btn">Back to Dashboard</a>
        </div>
        <div id="courseContent" class="course-content">
            <p class="loading">Loading course...</p>
        </div>
    </div>

    <script>
        const API_BASE_URL = (() => {
            if (window.location.hostname.includes('veelearn.org')) {
                return 'https://api.veelearn.org';
            }
            if (window.location.hostname.includes('github.io')) {
                return 'https://veelearn.onrender.com';
            }
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'http://localhost:3000';
            }
            return window.location.origin;
        })();

        const authToken = localStorage.getItem('token');
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('courseId');

        if (!authToken) {
            window.location.href = 'index.html';
        }

        if (!courseId) {
            document.getElementById('courseContent').innerHTML = '<p class="loading">No course specified.</p>';
        }

        let courseQuestions = [];
        let currentViewerPageIndex = 0;
        let viewerPages = [];

        async function loadCourse() {
            try {
                // Load course questions first
                await loadCourseQuestions(courseId);
                
                const response = await fetch(`${API_BASE_URL}/api/courses/${courseId}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                const data = await response.json();
                
                if (response.ok && data.data) {
                    const course = data.data;
                    
                    // Split content into pages for viewer
                    const rawContent = course.content || "";
                    if (rawContent.includes('<hr class="page-break">')) {
                        viewerPages = rawContent.split('<hr class="page-break">');
                    } else {
                        viewerPages = [rawContent];
                    }
                    
                    currentViewerPageIndex = 0;
                    renderViewerPage(0);
                } else {
                    document.getElementById('courseContent').innerHTML = '<p class="loading">Failed to load course.</p>';
                }
            } catch (error) {
                console.error('Error loading course:', error);
                document.getElementById('courseContent').innerHTML = '<p class="loading">Error loading course.</p>';
            }
        }

        async function loadCourseQuestions(courseId) {
            try {
                const response = await fetch(`${API_BASE_URL}/api/courses/${courseId}/questions`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                const data = await response.json();
                if (response.ok && data.data) {
                    courseQuestions = data.data;
                    console.log(`Loaded ${courseQuestions.length} questions for course ${courseId}`);
                }
            } catch (error) {
                console.error('Error loading course questions:', error);
            }
        }

        function renderViewerPage(index) {
            const courseContent = document.getElementById('courseContent');
            courseContent.innerHTML = `
                <h2 class="course-title">Course Content</h2>
                <div id="course-content-display" style="margin: 20px 0; position: relative; min-height: 400px;">
                    ${viewerPages[index] || "No content"}
                </div>
                <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: space-between; align-items: center;">
                    <button onclick="showDashboard()" style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer;">Back to Dashboard</button>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <span id="viewer-page-indicator">Page ${index + 1} of ${viewerPages.length}</span>
                        <button id="viewer-prev-btn" onclick="changeViewerPage(-1)" ${index === 0 ? 'disabled' : ''} style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer;">Previous</button>
                        <button id="viewer-next-btn" onclick="changeViewerPage(1)" style="padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer;">${index === viewerPages.length - 1 ? 'Finish' : 'Next'}</button>
                    </div>
                </div>
            `;
            
            // Hydrate quiz placeholders
            hydrateQuizPlaceholders();
        }

        function changeViewerPage(delta) {
            const newIndex = currentViewerPageIndex + delta;
            if (newIndex >= 0 && newIndex < viewerPages.length) {
                currentViewerPageIndex = newIndex;
                renderViewerPage(newIndex);
            }
        }

        function hydrateQuizPlaceholders() {
            const contentDisplay = document.getElementById('course-content-display');
            if (!contentDisplay) return;
            
            const placeholders = contentDisplay.querySelectorAll('.quiz-question-placeholder');
            if (placeholders.length === 0) return;
            
            console.log(`Hydrating ${placeholders.length} quiz placeholders, courseQuestions: ${courseQuestions.length}`);
            
            let questionCounter = 0;
            placeholders.forEach(placeholder => {
                const questionId = parseInt(placeholder.dataset.questionId);
                if (!questionId || isNaN(questionId)) return;
                
                const question = courseQuestions.find(q => q.id === questionId);
                if (question) {
                    const questionEl = createQuizQuestionElement(question, questionCounter);
                    questionCounter++;
                    questionEl.style.border = '2px solid #667eea';
                    questionEl.style.background = 'rgba(102, 126, 234, 0.1)';
                    questionEl.style.cursor = 'default';
                    placeholder.replaceWith(questionEl);
                }
            });
        }

        function createQuizQuestionElement(question, index) {
            const div = document.createElement('div');
            div.className = 'quiz-question';
            div.style.margin = '20px 0';
            div.style.padding = '20px';
            div.style.borderRadius = '8px';
            div.style.background = '#16213e';
            
            let questionText = question.question || question.text || '';
            let options = question.options || question.choices || [];
            let correctIndex = question.correct || question.answer || question.correct_answer;
            
            div.innerHTML = `
                <p style="font-size: 18px; margin-bottom: 15px; color: #eee;"><strong>Question ${index + 1}:</strong> ${questionText}</p>
                <div class="quiz-options" style="display: flex; flex-direction: column; gap: 10px;">
                </div>
            `;
            
            const optionsContainer = div.querySelector('.quiz-options');
            options.forEach((opt, optIndex) => {
                const isCorrect = optIndex === correctIndex || opt === correctIndex;
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.style.padding = '10px 15px';
                btn.style.background = '#0f3460';
                btn.style.color = '#eee';
                btn.style.border = '1px solid #1a1a2e';
                btn.style.borderRadius = '5px';
                btn.style.cursor = 'pointer';
                btn.style.textAlign = 'left';
                btn.onclick = () => checkAnswer(btn, isCorrect);
                optionsContainer.appendChild(btn);
            });
            
            return div;
        }

        function checkAnswer(button, isCorrect) {
            const options = button.parentElement.querySelectorAll('button');
            options.forEach(opt => {
                opt.disabled = true;
                opt.style.cursor = 'not-allowed';
            });
            
            if (isCorrect) {
                button.classList.add('correct');
            } else {
                button.classList.add('incorrect');
            }
        }

        if (courseId) {
            loadCourse();
        }
    </script>
</body>
</html>
