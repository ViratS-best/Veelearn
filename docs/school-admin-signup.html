<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Admin Signup — Bring Veelearn to Your School</title>
    <meta name="description" content="Register your school on Veelearn: free STEM courses, mastery-tracked AI practice and teacher dashboards for every classroom, with no per-seat cost." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://veelearn.org/school-admin-signup.html" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://veelearn.org/school-admin-signup.html" />
    <meta property="og:title" content="School Admin Signup — Bring Veelearn to Your School" />
    <meta property="og:description" content="Free STEM courses, AI practice and teacher dashboards for every classroom, with no per-seat cost." />
    <meta property="og:image" content="https://veelearn.org/assets/og-image.png" />
    <meta property="og:site_name" content="Veelearn" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="School Admin Signup — Bring Veelearn to Your School" />
    <meta name="twitter:description" content="Set up free STEM courses, AI practice and teacher dashboards for your whole school." />
    <meta name="twitter:image" content="https://veelearn.org/assets/og-image.png" />
    <link rel="icon" type="image/png" href="VEELEARN.png">
    <link rel="stylesheet" href="luxury-editorial.css">
    <link rel="stylesheet" href="styles-redesign.css">
    <style>
        body {
            background: #f8fafc;
        }
        .signup-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border: 1px solid #e5e7eb;
        }
        .signup-container h1 {
            color: #1e293b;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            color: #1e293b;
            font-size: 16px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: #dc2626;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }
        .success-message {
            color: #16a34a;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }
        small {
            color: #6b7280 !important;
        }
    </style>
  <link rel="stylesheet" href="responsive.css?v=1" />
</head>
<body>
    <div class="signup-container">
        <h1>🏫 School Admin Signup</h1>
        <p style="margin: 0 0 20px; color: #4b5563; font-size: 15px; line-height: 1.6;"><strong>100% free, always.</strong> Veelearn is a nonprofit, fiscally sponsored by Hack Club, with no per-seat cost for your school. <a href="https://hcb.hackclub.com/veelearn" style="color: #6254f5;">Donate to keep it free</a>.</p>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <small style="color: #888; font-size: 12px;">Must be at least 8 characters with uppercase, lowercase, and number</small>
            </div>
            
            <div class="form-group">
                <label for="school_name">School Name</label>
                <input type="text" id="school_name" name="school_name" required>
            </div>
            
            <div class="form-group">
                <label for="school_address">School Address (Optional)</label>
                <input type="text" id="school_address" name="school_address">
            </div>
            
            <button type="submit" class="btn-submit">Register as School Admin</button>
        </form>
        
        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script>
        const API_BASE_URL = (() => {
            if (window.location.hostname.includes('veelearn.org')) {
                return 'https://api.veelearn.org';
            }
            if (window.location.hostname.includes('github.io')) {
                return 'https://veelearn.onrender.com';
            }
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'http://localhost:3000';
            }
            return window.location.origin;
        })();

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                school_name: document.getElementById('school_name').value,
                school_address: document.getElementById('school_address').value
            };
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/register/school-admin`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    successMessage.textContent = data.message || 'Registration successful! Your account is pending approval from the Superadmin.';
                    successMessage.style.display = 'block';
                    document.getElementById('signupForm').reset();
                    
                    // Redirect to login after 3 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                } else {
                    errorMessage.textContent = data.message || 'Registration failed. Please try again.';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                errorMessage.textContent = 'Network error. Please check your connection and try again.';
                errorMessage.style.display = 'block';
            }
        });
    </script>
  <script src="mobile-responsive.js?v=2" defer></script>
</body>
</html>
